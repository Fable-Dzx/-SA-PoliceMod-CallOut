name: 构建我的CLEO模组  # 工作流的名称

on:  # 定义触发时机
  push:  # 当有代码推送到特定分支时触发
    branches: [ main ]
  pull_request:  # 当有拉取请求时触发
    branches: [ main ]
  workflow_dispatch:  # 允许你手动在GitHub网页上点击按钮运行[reference:16]

jobs:  # 定义要执行的任务
  build:
    runs-on: ubuntu-latest  # 指定运行环境为最新的Ubuntu系统

    steps:  # 任务的具体步骤
    - name: 检出代码
      uses: actions/checkout@v4  # 使用官方动作，将你的代码下载到虚拟机上[reference:20][reference:21]

    - name: 上传构建物
      uses: actions/upload-artifact@v4  # 上传打包好的文件
      with:
        name: MyCleoMod  # 构建物的名字
        path: ./  # 要打包的路径，这里将打包整个仓库